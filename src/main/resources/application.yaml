spring:
  application:
    name: liva
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${LIVA_DB_HOST:localhost}:${LIVA_DB_PORT:5433}/${LIVA_DB_NAME:liva}
    username: ${LIVA_DB_USER:liva}
    password: ${LIVA_DB_PASSWORD:}
    hikari:
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

confirmasus:
  seguranca:
    api-key: ${API_KEY:}
    jwt-segredo: ${JWT_SEGREDO:}
  cors:
    origens-permitidas: ${CORS_ORIGENS_PERMITIDAS:http://localhost:3000}
  fuso: ${FUSO_HORARIO:America/Sao_Paulo}
  disparo-diario:
    habilitado: ${DISPARO_DIARIO_HABILITADO:true}
    cron: ${DISPARO_DIARIO_CRON:0 0 8 * * *}
  whatsapp:
    provedor: ${WHATSAPP_PROVEDOR:console}
  atendimento-teste:
    habilitado: ${ATENDIMENTO_TESTE_HABILITADO:true}
  webhook:
    token: ${WEBHOOK_TOKEN:}
    aceitar-mensagens-proprias: ${WEBHOOK_ACEITAR_MENSAGENS_PROPRIAS:false}

evolution:
  url: ${EVOLUTION_URL:http://localhost:8080}
  api-key: ${EVOLUTION_API_KEY}
  instancia: ${EVOLUTION_INSTANCIA:liva}
